<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notificacion de nuevo evento</title>
</head>
<body>
<p>Estimado miembro,</p>
<p>Tenemos un nuevo evento: <strong th:text="${eventTitle}"></strong> programado para <strong th:text="${eventDate}"></strong>.</p>
<p>Para mas detalles, visita nuestro <a th:href="${frontendUrl}">sitio web</a>.</p>
<p>Saludos cordiales,<br/> <strong th:text="${orgName}"></strong></p>
</body>
</html>
