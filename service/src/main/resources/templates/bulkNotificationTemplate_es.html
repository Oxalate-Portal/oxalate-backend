<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mensaje del organizador del evento</title>
</head>
<body>
    <p>Estimado miembro,</p>
    <p><strong th:text="${notificationTitle}"></strong></p>
    <p th:text="${notificationMessage}"></p>
    <p th:if="${eventLink != null}">Para más detalles sobre el evento: <a th:href="${eventLink}" th:text="${eventLink}"></a></p>
    <p>Saludos cordiales,<br/> <strong th:text="${orgName}"></strong></p>
</body>
</html>
