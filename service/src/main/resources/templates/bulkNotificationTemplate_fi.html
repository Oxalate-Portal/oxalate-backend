<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Viesti tapahtuman järjestäjältä</title>
</head>
<body>
    <p>Hyvä jäsen,</p>
    <p><strong th:text="${notificationTitle}"></strong></p>
    <p th:text="${notificationMessage}"></p>
    <p th:if="${eventLink != null}">Lisätietoja tapahtumasta: <a th:href="${eventLink}" th:text="${eventLink}"></a></p>
    <p>Ystävällisin terveisin,<br/> <strong th:text="${orgName}"></strong></p>
</body>
</html>
