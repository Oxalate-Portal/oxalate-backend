<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Meddelande från evenemangsarrangören</title>
</head>
<body>
    <p>Hej,</p>
    <p><strong th:text="${notificationTitle}"></strong></p>
    <p th:text="${notificationMessage}"></p>
    <p th:if="${eventLink != null}">Mer information om evenemanget: <a th:href="${eventLink}" th:text="${eventLink}"></a></p>
    <p>Med vänliga hälsningar,<br/> <strong th:text="${orgName}"></strong></p>
</body>
</html>
